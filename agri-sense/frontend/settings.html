<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统设置 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .setting-row { display: flex; align-items: center; padding: 16px 4px; border-bottom: 1px solid #eef2ef; }
    .setting-row:last-child { border-bottom: none; }
    .setting-info { flex: 1; }
    .setting-label { font-weight: 600; font-size: 14px; }
    .setting-key { font-size: 12px; color: #98a29b; font-family: monospace; }
    .setting-input { width: 220px; }
    .perm-panel { max-width: 480px; margin: 80px auto; text-align: center; }
    .group-title { font-size: 13px; font-weight: 700; color: #2e7d32; margin: 18px 0 4px; }
    .save-bar { position: sticky; bottom: 16px; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 无权限提示 -->
    <div id="perm-box" class="perm-panel d-none">
      <i class="bi bi-shield-lock" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">需要管理员权限</h4>
      <p class="text-muted" id="perm-text">系统设置仅对管理员开放，请使用管理员账号登录。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=settings.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="settings-box" class="d-none" style="max-width:760px">

      <!-- 灌溉策略 -->
      <div class="sensor-card mb-3">
        <div class="group-title"><i class="bi bi-water"></i> 灌溉策略</div>
        <div id="group-irrigation"></div>
      </div>

      <!-- 告警策略 -->
      <div class="sensor-card mb-3">
        <div class="group-title"><i class="bi bi-bell"></i> 告警策略</div>
        <div id="group-alert"></div>
      </div>

      <!-- 站点与前端 -->
      <div class="sensor-card mb-3">
        <div class="group-title"><i class="bi bi-display"></i> 站点与前端</div>
        <div id="group-site"></div>
      </div>

      <!-- 保存栏 -->
      <div class="save-bar">
        <div class="sensor-card d-flex align-items-center gap-2">
          <button class="btn btn-success" id="btn-save"><i class="bi bi-check-lg"></i> 保存设置</button>
          <button class="btn btn-outline-secondary" id="btn-reload">还原</button>
          <span class="text-muted ms-auto" style="font-size:12px">
            <i class="bi bi-info-circle"></i> 设置保存后立即生效并持久化，重启服务不丢失；变更记录写入审计日志
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "settings", title: "系统设置", icon: "bi-gear" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/settings.js?v=1"></script>
  <script src="js/layout.js?v=7"></script>
</body>
</html>
