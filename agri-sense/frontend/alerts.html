<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告警中心 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .rt-list { height: 260px; overflow-y: auto; }
    .rt-item { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed #eef1ef; }
    .rt-item:last-child { border-bottom: none; }
    .rt-rank { width: 22px; height: 22px; border-radius: 50%; background: #eef4ef; color: #2e7d32;
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px; }
    .rt-rank.r1 { background: #fff3cd; color: #b8860b; }
    .rt-rank.r2 { background: #eef1f5; color: #607d8b; }
    .rt-rank.r3 { background: #fbe9e7; color: #bf6b3f; }
    .rt-main { flex: 1; min-width: 0; }
    .rt-title { font-size: 13px; color: #333; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rt-bar { height: 5px; background: #f0f4f1; border-radius: 3px; overflow: hidden; margin: 5px 0 3px; }
    .rt-bar i { display: block; height: 100%; background: linear-gradient(90deg, #66bb6a, #2e7d32); border-radius: 3px; }
    .rt-meta { font-size: 11.5px; color: #999; display: flex; gap: 8px; flex-wrap: wrap; }
    .rt-empty { padding: 60px 0; text-align: center; color: #aaa; font-size: 12.5px; }
    .rt-empty i { display: block; font-size: 34px; margin-bottom: 6px; color: #d5ddd7; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 告警统计 -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-exclamation-triangle text-danger"></i>
          <div><div class="fw-bold" id="cnt-pending">0</div><small class="text-muted">待处理</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-check-circle text-success"></i>
          <div><div class="fw-bold" id="cnt-handled">0</div><small class="text-muted">已处理</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-bell text-warning"></i>
          <div><div class="fw-bold" id="cnt-warning">0</div><small class="text-muted">警告级</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-fire text-danger"></i>
          <div><div class="fw-bold" id="cnt-critical">0</div><small class="text-muted">严重级</small></div></div>
      </div>
    </div>

    <!-- 告警列表 -->
    <div class="sensor-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0"><i class="bi bi-list-check"></i> 告警列表</h6>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary alert-filter active" data-status="">全部</button>
          <button class="btn btn-outline-secondary alert-filter" data-status="pending">待处理</button>
          <button class="btn btn-outline-secondary alert-filter" data-status="handled">已处理</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>时间</th>
              <th>级别</th>
              <th>类型</th>
              <th>设备</th>
              <th>消息</th>
              <th>状态</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="alerts-table">
            <tr><td colspan="7" class="text-center text-muted py-3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Top 规则命中排行 + 规则命中趋势 -->
    <div class="row g-3 mb-4">
      <div class="col-lg-4">
        <div class="sensor-card h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0"><i class="bi bi-trophy"></i> Top 规则命中排行</h6>
            <small class="text-muted" id="top-total"></small>
          </div>
          <div class="rt-list" id="rule-top-list">
            <div class="rt-empty"><i class="bi bi-hourglass-split"></i>加载中...</div>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="sensor-card h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0"><i class="bi bi-graph-up"></i> 规则命中趋势
              <small class="text-muted fw-normal ms-2" id="trend-total"></small>
            </h6>
            <select class="form-select form-select-sm w-auto" id="trend-days">
              <option value="7" selected>近 7 天</option>
              <option value="14">近 14 天</option>
              <option value="30">近 30 天</option>
            </select>
          </div>
          <div id="rule-trend" style="height: 260px;"></div>
        </div>
      </div>
    </div>

    <!-- 告警规则 -->
    <div class="sensor-card">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h6 class="mb-0"><i class="bi bi-shield-check"></i> 告警规则
          <small class="text-muted fw-normal ms-2" id="rule-stats"></small>
        </h6>
        <div class="d-flex flex-wrap gap-2">
          <select class="form-select form-select-sm" id="tpl-select" style="width: 180px">
            <option value="">套用规则模板...</option>
          </select>
          <button class="btn btn-outline-success btn-sm" id="btn-bulk-enable">
            <i class="bi bi-toggle-on"></i> 全部启用
          </button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-bulk-disable">
            <i class="bi bi-toggle-off"></i> 全部停用
          </button>
          <button class="btn btn-success btn-sm" id="btn-add-rule">
            <i class="bi bi-plus-lg"></i> 新增规则
          </button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>指标</th>
              <th>条件</th>
              <th>阈值</th>
              <th>级别</th>
              <th>启用</th>
              <th>命中次数</th>
              <th>最近触发</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="rules-table">
            <tr><td colspan="8" class="text-center text-muted py-3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 规则弹窗 -->
    <div class="modal fade" id="rule-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="rule-modal-title"><i class="bi bi-shield"></i> 新增规则</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="rule-form">
              <input type="hidden" id="f-rule-id" />
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">监测指标</label>
                  <select class="form-select" id="f-rule-metric">
                    <option value="soil_moisture">土壤墒情(%)</option>
                    <option value="temperature">温度(°C)</option>
                    <option value="humidity">湿度(%)</option>
                    <option value="light">光照(lux)</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">条件</label>
                  <select class="form-select" id="f-rule-condition">
                    <option value="lt">小于 (<)</option>
                    <option value="gt">大于 (>)</option>
                  </select>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">阈值</label>
                  <input type="number" class="form-control" id="f-rule-threshold" value="30" step="0.1" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">告警级别</label>
                  <select class="form-select" id="f-rule-level">
                    <option value="info">提示</option>
                    <option value="warning" selected>警告</option>
                    <option value="critical">严重</option>
                  </select>
                </div>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="f-rule-enabled" checked />
                <label class="form-check-label" for="f-rule-enabled">启用该规则</label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-success" id="btn-save-rule">保存</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "alerts", title: "告警中心", icon: "bi-bell" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
