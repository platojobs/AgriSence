<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工单管理 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .stat-card { text-align: center; padding: 18px 10px; }
    .stat-card .num { font-size: 26px; font-weight: 700; }
    .stat-card .lbl { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .badge-priority-low { background: #eceff1; color: #607d8b; }
    .badge-priority-medium { background: #e3f2fd; color: #1565c0; }
    .badge-priority-high { background: #fff8e1; color: #f9a825; }
    .badge-priority-urgent { background: #ffebee; color: #c62828; }
    .badge-status-open { background: #fff8e1; color: #f9a825; }
    .badge-status-processing { background: #e3f2fd; color: #1565c0; }
    .badge-status-resolved { background: #e8f5e9; color: #2e7d32; }
    .badge-status-closed { background: #eceff1; color: #607d8b; }
    .badge-type-alert { background: #ffebee; color: #c62828; }
    .badge-type-ops { background: #e8f5e9; color: #2e7d32; }
    .badge-type-inspect { background: #f3e5f5; color: #6a1b9a; }
    .ticket-table td { vertical-align: middle; font-size: 14px; }
    .ticket-table .t-title { font-weight: 600; }
    .ticket-table .t-no { font-family: monospace; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 未登录提示 -->
    <div id="perm-box" class="perm-panel d-none" style="max-width:480px;margin:80px auto;text-align:center">
      <i class="bi bi-clipboard2-x" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">请先登录</h4>
      <p class="text-muted">工单管理需要登录后使用。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=tickets.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="ticket-box" class="d-none">
      <!-- 统计卡片 -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num" id="st-total">0</div><div class="lbl">工单总数</div></div>
        </div>
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num text-warning" id="st-open">0</div><div class="lbl">待处理</div></div>
        </div>
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num text-primary" id="st-processing">0</div><div class="lbl">处理中</div></div>
        </div>
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num text-success" id="st-resolved">0</div><div class="lbl">已解决</div></div>
        </div>
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num text-danger" id="st-urgent">0</div><div class="lbl">紧急工单</div></div>
        </div>
        <div class="col-6 col-md-3 col-xl-2">
          <div class="sensor-card stat-card"><div class="num text-secondary" id="st-unassigned">0</div><div class="lbl">待指派</div></div>
        </div>
      </div>

      <!-- 工具条 -->
      <div class="sensor-card mb-3">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary active" data-status="">全部</button>
            <button class="btn btn-outline-secondary" data-status="open">待处理</button>
            <button class="btn btn-outline-secondary" data-status="processing">处理中</button>
            <button class="btn btn-outline-secondary" data-status="resolved">已解决</button>
            <button class="btn btn-outline-secondary" data-status="closed">已关闭</button>
          </div>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary active" data-scope="">全部工单</button>
            <button class="btn btn-outline-secondary" data-scope="todo">指派给我</button>
            <button class="btn btn-outline-secondary" data-scope="mine">我创建的</button>
          </div>
          <div class="input-group input-group-sm" style="max-width:220px">
            <input type="text" class="form-control" id="kw" placeholder="搜索标题 / 单号" />
            <button class="btn btn-outline-secondary" id="btn-search"><i class="bi bi-search"></i></button>
          </div>
          <button class="btn btn-success btn-sm ms-auto" id="btn-new">
            <i class="bi bi-plus-lg"></i> 新建工单
          </button>
        </div>
      </div>

      <!-- 工单列表 -->
      <div class="sensor-card">
        <div class="table-responsive">
          <table class="table table-hover ticket-table mb-0">
            <thead>
              <tr>
                <th>单号</th><th>标题</th><th>类型</th><th>优先级</th><th>状态</th>
                <th>指派人</th><th>创建人</th><th>创建时间</th><th style="width:170px">操作</th>
              </tr>
            </thead>
            <tbody id="ticket-list">
              <tr><td colspan="9" class="text-center text-muted py-5">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建/编辑工单弹窗 -->
  <div class="modal fade" id="ticketModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">新建工单</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="f-id" />
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">工单标题 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="f-title" maxlength="100" placeholder="简要描述问题或任务" />
            </div>
            <div class="col-12">
              <label class="form-label">详细描述</label>
              <textarea class="form-control" id="f-desc" rows="3" placeholder="补充背景、位置、影响范围等信息"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">类型</label>
              <select class="form-select" id="f-type">
                <option value="ops">运维工单</option>
                <option value="alert">告警工单</option>
                <option value="inspect">巡检工单</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">优先级</label>
              <select class="form-select" id="f-priority">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
                <option value="urgent">紧急</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">指派给</label>
              <select class="form-select" id="f-assignee">
                <option value="">暂不指派</option>
              </select>
            </div>
            <div class="col-md-4 d-none" id="wrap-status">
              <label class="form-label">状态</label>
              <select class="form-select" id="f-status">
                <option value="open">待处理</option>
                <option value="processing">处理中</option>
                <option value="resolved">已解决</option>
                <option value="closed">已关闭</option>
              </select>
            </div>
            <div class="col-12 d-none" id="wrap-resolution">
              <label class="form-label">处理结果</label>
              <textarea class="form-control" id="f-resolution" rows="2" placeholder="记录处理过程与结论"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-success" id="btn-save"><i class="bi bi-check-lg"></i> 保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">工单详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detail-body"></div>
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "tickets", title: "工单管理", icon: "bi-clipboard2-check" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/tickets.js?v=1"></script>
  <script src="js/layout.js?v=9"></script>
</body>
</html>
