<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备分组 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .stat-card { text-align: center; padding: 18px 10px; }
    .stat-card .num { font-size: 26px; font-weight: 700; }
    .stat-card .lbl { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .group-card { padding: 16px 18px; height: 100%; }
    .group-card .g-name { font-size: 16px; font-weight: 700; color: #1f2d24; }
    .group-card .g-loc { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .group-card .g-desc { font-size: 13px; color: #4b5563; margin-top: 8px; min-height: 34px; }
    .group-card .g-meta { font-size: 12px; color: #8a948e; margin-top: 8px; }
    .group-card .g-actions { margin-top: 12px; }
    .grp-table td { vertical-align: middle; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 未登录提示 -->
    <div id="perm-box" class="perm-panel d-none" style="max-width:480px;margin:80px auto;text-align:center">
      <i class="bi bi-diagram-3" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">请先登录</h4>
      <p class="text-muted">设备分组需要登录后使用。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=groups.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="grp-box" class="d-none">
      <!-- 统计卡片 -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <div class="sensor-card stat-card"><div class="num" id="st-groups">0</div><div class="lbl">分组数量</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="sensor-card stat-card"><div class="num text-success" id="st-online">0</div><div class="lbl">在线设备</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="sensor-card stat-card"><div class="num text-primary" id="st-devices">0</div><div class="lbl">设备总数</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="sensor-card stat-card"><div class="num text-warning" id="st-ungrouped">0</div><div class="lbl">未分组设备</div></div>
        </div>
      </div>

      <!-- 分组卡片区 -->
      <div class="sensor-card mb-3">
        <div class="d-flex align-items-center mb-3">
          <h6 class="mb-0"><i class="bi bi-diagram-3"></i> 分组列表</h6>
          <button class="btn btn-success btn-sm ms-auto" id="btn-new-group">
            <i class="bi bi-plus-lg"></i> 新建分组
          </button>
        </div>
        <div class="row g-3" id="group-cards">
          <div class="col-12 text-center text-muted py-4">加载中...</div>
        </div>
      </div>

      <!-- 设备分配 -->
      <div class="sensor-card">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
          <h6 class="mb-0"><i class="bi bi-cpu"></i> 设备归属</h6>
          <div class="btn-group btn-group-sm ms-auto">
            <button class="btn btn-outline-secondary active" data-filter="">全部设备</button>
            <button class="btn btn-outline-secondary" data-filter="ungrouped">仅未分组</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover grp-table mb-0">
            <thead>
              <tr><th>设备 ID</th><th>名称</th><th>安装位置</th><th>状态</th><th>所属分组</th><th style="width:200px">分配到</th></tr>
            </thead>
            <tbody id="device-list">
              <tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 分组编辑弹窗 -->
  <div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">新建分组</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="f-id" />
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">分组名称 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="f-name" maxlength="40" placeholder="如 1号温室大棚" />
            </div>
            <div class="col-12">
              <label class="form-label">位置</label>
              <input type="text" class="form-control" id="f-location" placeholder="如 东区 A 排" />
            </div>
            <div class="col-12">
              <label class="form-label">负责人</label>
              <select class="form-select" id="f-leader">
                <option value="">暂不指定</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">说明</label>
              <textarea class="form-control" id="f-description" rows="2" placeholder="种植品种、面积等备注"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-success" id="btn-save-group"><i class="bi bi-check-lg"></i> 保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "groups", title: "设备分组", icon: "bi-diagram-3" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/groups.js?v=1"></script>
  <script src="js/layout.js?v=9"></script>
</body>
</html>
