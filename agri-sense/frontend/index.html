<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仪表盘 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
</head>
<body>
  <div id="app-root">

    <!-- 概览统计卡片 -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="mini-stat">
          <i class="bi bi-database"></i>
          <div>
            <small class="text-muted">采集数据点</small>
            <div id="stat-readings" class="fw-bold">--</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat">
          <i class="bi bi-cpu"></i>
          <div>
            <small class="text-muted">在线设备</small>
            <div id="stat-devices" class="fw-bold">--</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat">
          <i class="bi bi-bell"></i>
          <div>
            <small class="text-muted">待处理告警</small>
            <div id="stat-alerts" class="fw-bold">--</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat">
          <i class="bi bi-water"></i>
          <div>
            <small class="text-muted">灌溉次数</small>
            <div id="stat-irrigation" class="fw-bold">--</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- 左侧：传感器卡片 -->
      <div class="col-lg-4">
        <div class="row g-3">
          <div class="col-12">
            <div id="soil-card" class="sensor-card soil-card normal">
              <div class="card-head">
                <span class="card-label"><i class="bi bi-droplet-half"></i> 土壤墒情</span>
                <span class="badge bg-success">实时</span>
              </div>
              <div class="card-value"><span id="soil-value">--</span><small class="unit">%</small></div>
              <div class="card-foot">阈值范围：<span id="soil-range">30% ~ 70%</span></div>
            </div>
          </div>
          <div class="col-12">
            <div class="sensor-card temp-card">
              <div class="card-head">
                <span class="card-label"><i class="bi bi-thermometer-half"></i> 环境温度</span>
                <span class="badge bg-success">实时</span>
              </div>
              <div class="card-value"><span id="temp-value">--</span><small class="unit">°C</small></div>
              <div class="card-foot">适宜范围：15°C ~ 30°C</div>
            </div>
          </div>
          <div class="col-12">
            <div class="sensor-card hum-card">
              <div class="card-head">
                <span class="card-label"><i class="bi bi-cloud-haze"></i> 空气湿度</span>
                <span class="badge bg-success">实时</span>
              </div>
              <div class="card-value"><span id="hum-value">--</span><small class="unit">%</small></div>
              <div class="card-foot">适宜范围：50% ~ 85%</div>
            </div>
          </div>
          <div class="col-12">
            <div class="sensor-card light-card">
              <div class="card-head">
                <span class="card-label"><i class="bi bi-brightness-high"></i> 光照强度</span>
                <span class="badge bg-success">实时</span>
              </div>
              <div class="card-value"><span id="light-value">--</span><small class="unit">lux</small></div>
              <div class="card-foot">状态：<span id="light-status">--</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧：趋势图 + 概览 -->
      <div class="col-lg-8">
        <div class="row g-3">
          <div class="col-12">
            <div class="sensor-card chart-card">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0"><i class="bi bi-graph-up"></i> 过去 24 小时趋势</h6>
                <span class="badge bg-outline">5 分钟聚合</span>
              </div>
              <div id="history-chart" style="height:340px;"></div>
            </div>
          </div>
          <div class="col-12">
            <div class="row g-3">
              <div class="col-6 col-md-3">
                <div class="mini-stat">
                  <i class="bi bi-thermometer-sun"></i>
                  <div><small class="text-muted">最高温</small><div id="max-temp" class="fw-bold">--</div></div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="mini-stat">
                  <i class="bi bi-thermometer-snow"></i>
                  <div><small class="text-muted">最低温</small><div id="min-temp" class="fw-bold">--</div></div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="mini-stat">
                  <i class="bi bi-droplet"></i>
                  <div><small class="text-muted">平均墒情</small><div id="avg-moisture" class="fw-bold">--</div></div>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="mini-stat">
                  <i class="bi bi-bar-chart"></i>
                  <div><small class="text-muted">采集点数</small><div id="data-count" class="fw-bold">--</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 灌溉状态快捷区 -->
    <div class="row g-4 mt-2">
      <div class="col-12">
        <div class="sensor-card control-card">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1"><i class="bi bi-water"></i> 灌溉决策</h6>
              <div class="irrigation-status-pill status-hold" id="irrigation-pill">
                <i class="bi bi-circle-fill"></i> <span id="irrigation-status">--</span>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button id="btn-start" class="btn btn-success"><i class="bi bi-play-fill"></i> 开启灌溉</button>
              <button id="btn-stop" class="btn btn-outline-secondary"><i class="bi bi-stop-fill"></i> 停止</button>
              <a href="irrigation.html" class="btn btn-outline-primary"><i class="bi bi-gear"></i> 详细管理</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 执行器状态面板 -->
    <div class="row g-3 mt-4">
      <div class="col-12">
        <div class="sensor-card">
          <h6 class="mb-3"><i class="bi bi-toggle-on"></i> 执行器状态</h6>
          <div class="row g-3" id="actuator-panel">
            <div class="col-12 text-center text-muted py-3">加载中...</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "dashboard", title: "仪表盘", icon: "bi-speedometer2" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/control.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
