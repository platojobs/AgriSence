<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟数据 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
</head>
<body>
  <div id="app-root">

    <div class="alert alert-warning py-2" id="admin-tip" style="display: none;">
      <i class="bi bi-shield-exclamation"></i> 生成与清理模拟数据需要管理员权限，当前账号仅可查看。
    </div>

    <!-- 统计 -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-database text-success"></i>
          <div><div class="fw-bold" id="st-total">0</div><small class="text-muted">总读数</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-magic text-primary"></i>
          <div><div class="fw-bold" id="st-mock">0</div><small class="text-muted">模拟行数</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-clock-history text-warning"></i>
          <div><div class="fw-bold small" id="st-from">--</div><small class="text-muted">模拟起始</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-clock text-info"></i>
          <div><div class="fw-bold small" id="st-to">--</div><small class="text-muted">模拟最新</small></div></div>
      </div>
    </div>

    <!-- 生成 -->
    <div class="sensor-card mb-4">
      <h6 class="mb-3"><i class="bi bi-magic"></i> 生成模拟数据</h6>
      <p class="text-muted small">
        按昼夜规律生成温度、湿度、光照与墒情曲线（含灌溉补水），用于报表与数据大屏演示。
        仅写入来源为 <code>mock</code> 的记录，可随时一键清空，不影响真实上报数据。
      </p>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">生成天数</label>
          <select class="form-select" id="f-days">
            <option value="1">1 天</option>
            <option value="3">3 天</option>
            <option value="7" selected>7 天</option>
            <option value="14">14 天</option>
            <option value="30">30 天</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">采样间隔</label>
          <select class="form-select" id="f-interval">
            <option value="5">5 分钟</option>
            <option value="10">10 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30" selected>30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">归属设备</label>
          <select class="form-select" id="f-device"></select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-success w-100" id="btn-generate">
            <i class="bi bi-lightning-charge"></i> 开始生成
          </button>
        </div>
      </div>
      <div class="mt-3 small text-muted" id="preview-text">预计生成 -- 条记录</div>
    </div>

    <!-- 清理 -->
    <div class="sensor-card">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h6 class="mb-1"><i class="bi bi-trash3"></i> 清理模拟数据</h6>
          <small class="text-muted">仅删除数据来源为 mock 的读数，真实传感器数据不受影响。</small>
        </div>
        <button class="btn btn-outline-danger" id="btn-clear">
          <i class="bi bi-eraser"></i> 清空模拟数据
        </button>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "mockdata", title: "模拟数据", icon: "bi-magic" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/mockdata.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
