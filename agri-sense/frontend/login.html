<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - AgriSense 智慧农业监测系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root { --agri-green: #2e7d32; --agri-green-dark: #1b5e20; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f4f7f5;
    }
    .login-wrap { display: flex; min-height: 100vh; }
    .login-brand {
      flex: 1.1; background: linear-gradient(145deg, #1b5e20 0%, #2e7d32 45%, #43a047 100%);
      color: #fff; padding: 64px 56px; display: flex; flex-direction: column; justify-content: center;
      position: relative; overflow: hidden;
    }
    .login-brand::after {
      content: ""; position: absolute; right: -80px; bottom: -80px;
      width: 320px; height: 320px; border-radius: 50%;
      background: rgba(255, 255, 255, .06);
    }
    .brand-logo { font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .brand-logo i { font-size: 34px; }
    .brand-sub { margin-top: 6px; opacity: .8; font-size: 14px; letter-spacing: 1px; }
    .brand-title { font-size: 30px; font-weight: 700; margin-top: 48px; line-height: 1.4; }
    .brand-desc { margin-top: 18px; font-size: 14px; line-height: 1.9; opacity: .9; max-width: 460px; }
    .brand-points { margin-top: 40px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 480px; }
    .brand-point { background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 14px 16px; font-size: 13px; }
    .brand-point i { font-size: 18px; margin-right: 6px; }
    .login-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 36px 32px; box-shadow: 0 10px 40px rgba(0, 0, 0, .08); }
    .login-card h2 { font-size: 22px; font-weight: 700; color: #23302a; }
    .login-card .sub { color: #8a938d; font-size: 13px; margin-top: 6px; margin-bottom: 24px; }
    .form-label { font-size: 13px; color: #5c665f; }
    .form-control { padding: 10px 12px; font-size: 14px; }
    .btn-agri { background: var(--agri-green); border: none; color: #fff; padding: 11px; font-weight: 600; }
    .btn-agri:hover { background: var(--agri-green-dark); color: #fff; }
    .demo-box { margin-top: 22px; border-top: 1px dashed #e2e8e4; padding-top: 16px; }
    .demo-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #7c857f; margin-bottom: 6px; }
    .demo-chip { border: 1px solid #d8e5db; background: #f6faf7; color: #2e7d32; border-radius: 12px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
    .demo-chip:hover { background: #e8f5e9; }
    .back-home { position: fixed; top: 20px; right: 24px; font-size: 13px; color: #6b756e; text-decoration: none; }
    .back-home:hover { color: var(--agri-green); }
    @media (max-width: 900px) {
      .login-brand { display: none; }
    }
  </style>
</head>
<body>
  <a class="back-home" href="index.html"><i class="bi bi-arrow-left"></i> 返回首页</a>

  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-logo"><i class="bi bi-flower1"></i> AgriSense</div>
      <div class="brand-sub">智慧农业监测与决策平台</div>
      <div class="brand-title">让每一亩土地<br />都用数据说话</div>
      <div class="brand-desc">
        面向设施农业与种植基地的一体化数字平台：环境感知、智能灌溉、
        执行器控制、气象服务、农产品溯源与 AI 病害识别。
      </div>
      <div class="brand-points">
        <div class="brand-point"><i class="bi bi-activity"></i>多参数环境感知</div>
        <div class="brand-point"><i class="bi bi-water"></i>天气驱动灌溉</div>
        <div class="brand-point"><i class="bi bi-shield-check"></i>全链条溯源</div>
        <div class="brand-point"><i class="bi bi-cpu"></i>规则引擎自动告警</div>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <h2>登录系统</h2>
        <div class="sub">请输入账号信息，不同角色拥有不同操作权限</div>

        <div id="login-alert" class="alert alert-danger py-2 d-none" style="font-size:13px"></div>

        <form id="login-form" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" class="form-control" id="username" placeholder="请输入用户名" required />
          </div>
          <div class="mb-2">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" id="password" placeholder="请输入密码" required />
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" checked />
              <label class="form-check-label" for="remember" style="font-size:13px;color:#5c665f">记住登录状态</label>
            </div>
            <a href="service.html" style="font-size:13px;color:#2e7d32;text-decoration:none">忘记密码？</a>
          </div>
          <button type="submit" class="btn btn-agri w-100" id="login-btn">登 录</button>
        </form>

        <div class="demo-box">
          <div class="demo-row"><span>演示账号（点击自动填充）</span></div>
          <div class="demo-row">
            <span>admin / admin123（管理员）</span>
            <span class="demo-chip" data-u="admin" data-p="admin123">填入</span>
          </div>
          <div class="demo-row">
            <span>operator / op123456（操作员）</span>
            <span class="demo-chip" data-u="operator" data-p="op123456">填入</span>
          </div>
          <div class="demo-row">
            <span>viewer / view123456（访客）</span>
            <span class="demo-chip" data-u="viewer" data-p="view123456">填入</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/login.js?v=1"></script>
</body>
</html>
