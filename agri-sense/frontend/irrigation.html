<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灌溉管理 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
</head>
<body>
  <div id="app-root">

    <!-- 手动控制 + 决策状态 -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="sensor-card control-card">
          <h6 class="mb-3"><i class="bi bi-sliders"></i> 手动控制</h6>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-success" id="btn-irr-start">
              <i class="bi bi-play-fill"></i> 开启灌溉
            </button>
            <button class="btn btn-outline-secondary" id="btn-irr-stop">
              <i class="bi bi-stop-fill"></i> 停止灌溉
            </button>
            <span class="irrigation-status-pill ms-auto" id="irr-status-pill">
              <i class="bi bi-circle-fill"></i> <span id="irr-status-text">--</span>
            </span>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="sensor-card">
          <h6 class="mb-3"><i class="bi bi-bar-chart"></i> 灌溉统计</h6>
          <div class="row text-center">
            <div class="col-4">
              <div class="display-6 text-success fw-bold" id="stat-start">0</div>
              <small class="text-muted">开启次数</small>
            </div>
            <div class="col-4">
              <div class="display-6 text-info fw-bold" id="stat-stop">0</div>
              <small class="text-muted">停止次数</small>
            </div>
            <div class="col-4">
              <div class="display-6 text-warning fw-bold" id="stat-total">0</div>
              <small class="text-muted">操作总数</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 灌溉调度 -->
    <div class="sensor-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0"><i class="bi bi-clock-history"></i> 灌溉调度</h6>
        <button class="btn btn-success btn-sm" id="btn-add-schedule">
          <i class="bi bi-plus-lg"></i> 新增调度
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>调度名称</th>
              <th>开始时间</th>
              <th>持续时长</th>
              <th>状态</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="schedule-table">
            <tr><td colspan="5" class="text-center text-muted py-3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 灌溉日志 -->
    <div class="sensor-card">
      <h6 class="mb-3"><i class="bi bi-journal-text"></i> 最近灌溉日志</h6>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0" id="log-table">
          <thead class="table-light">
            <tr>
              <th>时间</th>
              <th>操作</th>
              <th>原因</th>
            </tr>
          </thead>
          <tbody id="log-body">
            <tr><td colspan="3" class="text-center text-muted py-3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 调度弹窗 -->
    <div class="modal fade" id="schedule-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="schedule-modal-title"><i class="bi bi-clock"></i> 新增调度</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="schedule-form">
              <input type="hidden" id="f-schedule-id" />
              <div class="mb-3">
                <label class="form-label">调度名称</label>
                <input type="text" class="form-control" id="f-sch-name" placeholder="如 早晨灌溉" />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">开始时间</label>
                  <input type="time" class="form-control" id="f-sch-start" value="06:00" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">持续时长(分钟)</label>
                  <input type="number" class="form-control" id="f-sch-duration" value="30" min="1" />
                </div>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="f-sch-enabled" checked />
                <label class="form-check-label" for="f-sch-enabled">启用该调度</label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-success" id="btn-save-schedule">保存</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "irrigation", title: "灌溉管理", icon: "bi-water" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/irrigation.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
