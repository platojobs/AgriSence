<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系方式 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .cs-card { display: flex; gap: 14px; padding: 18px; border-radius: 14px; border: 1px solid #e8f5e9; background: #fff; height: 100%; }
    .cs-card .ico { width: 44px; height: 44px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .cs-card .t { font-weight: 700; color: #2e7d32; font-size: 14px; }
    .cs-card .v { font-size: 13px; color: #555; margin-top: 4px; }
    .cs-hero { background: linear-gradient(135deg, #1b5e20, #43a047); color: #fff; padding: 28px 32px; border-radius: 14px; margin-bottom: 18px; }
    .cs-hero h4 { font-weight: 700; margin-bottom: 6px; }
    .cs-hero p { opacity: .85; font-size: 13.5px; margin: 0; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 公司简介 + 联系卡（动态可编辑） -->
    <div id="site-content">

    <div class="cs-hero">
      <h4><i class="bi bi-geo-alt-fill"></i> 欢迎联系 AgriSense</h4>
      <p>我们随时准备为您提供智慧农业相关的咨询、方案设计与技术支持。请通过以下方式联系我们。</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6 col-lg-3">
        <div class="cs-card"><div class="ico"><i class="bi bi-geo-alt-fill"></i></div><div><div class="t">总部地址</div><div class="v">智慧农业产业园 A3 栋<br/>上海市浦东新区科苑路 88 号</div></div></div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="cs-card"><div class="ico"><i class="bi bi-telephone-fill"></i></div><div><div class="t">服务热线</div><div class="v">400-800-2010<br/>工作日 8:30 - 18:00</div></div></div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="cs-card"><div class="ico"><i class="bi bi-envelope-fill"></i></div><div><div class="t">邮件联系</div><div class="v">技术支持 support@agrisense.cn<br/>商务合作 contact@agrisense.cn</div></div></div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="cs-card"><div class="ico"><i class="bi bi-wechat"></i></div><div><div class="t">官方微信</div><div class="v">公众号：AgriSense2010<br/>微信扫描下方二维码关注</div></div></div>
      </div>
    </div>

    </div>

    <!-- 在线留言（保持静态：含表单提交逻辑，不由 CMS 驱动） -->
    <div class="sensor-card">
      <h6 class="mb-3"><i class="bi bi-chat-dots"></i> 在线留言</h6>
      <p class="small text-muted mb-3">填写以下表单，我们将在 1 个工作日内与您联系</p>
      <form id="feedback-form" class="row g-3">
        <div class="col-md-6">
          <label class="form-label small">您的姓名 <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm" name="name" required />
        </div>
        <div class="col-md-6">
          <label class="form-label small">联系电话 <span class="text-danger">*</span></label>
          <input type="tel" class="form-control form-control-sm" name="phone" required />
        </div>
        <div class="col-md-6">
          <label class="form-label small">公司/农场名称</label>
          <input type="text" class="form-control form-control-sm" name="company" />
        </div>
        <div class="col-md-6">
          <label class="form-label small">邮箱</label>
          <input type="email" class="form-control form-control-sm" name="email" />
        </div>
        <div class="col-12">
          <label class="form-label small">留言类型</label>
          <select class="form-select form-select-sm" name="type">
            <option value="咨询">产品咨询</option>
            <option value="售后">售后支持</option>
            <option value="合作">商务合作</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label small">留言内容 <span class="text-danger">*</span></label>
          <textarea class="form-control form-control-sm" name="content" rows="4" required placeholder="请简要描述您的需求或遇到的问题..."></textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-send"></i> 提交留言</button>
        </div>
      </form>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "contact", title: "联系方式", icon: "bi-geo-alt", siteKey: "contact" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/site-loader.js"></script>
  <script>
    // 在线留言提交
    $(function(){
      $('#feedback-form').on('submit', async function(e){
        e.preventDefault();
        const data = $(this).serializeObject ? $(this).serializeObject() : Object.fromEntries(new FormData(this));
        try {
          await $.ajax({ url: API_BASE + '/api/feedback', method: 'POST', contentType: 'application/json', data: JSON.stringify(data) });
          alert('留言已提交，我们将尽快与您联系！');
          this.reset();
        } catch(err) {
          alert('留言提交失败，请稍后重试或直接拨打 400-800-2010');
        }
      });
    });
    $.fn.serializeObject = function(){
      const o = {};
      this.serializeArray().forEach(x => o[x.name] = x.value);
      return o;
    };
  </script>
</body>
</html>
