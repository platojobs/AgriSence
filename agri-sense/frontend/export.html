<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据导出 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .type-card { border: 1px solid #e4eae6; border-radius: 12px; padding: 20px; background: #fff;
      transition: box-shadow .2s, transform .2s; height: 100%; }
    .type-card:hover { box-shadow: 0 6px 18px rgba(46,125,50,.10); transform: translateY(-2px); }
    .type-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 22px; margin-bottom: 12px; }
    .type-count { font-size: 24px; font-weight: 700; color: #2e7d32; }
    .type-label { font-weight: 600; }
    .type-role { font-size: 11px; color: #98a29b; }
    .perm-panel { max-width: 480px; margin: 80px auto; text-align: center; }
    .export-tip { font-size: 12px; color: #98a29b; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 无权限提示 -->
    <div id="perm-box" class="perm-panel d-none">
      <i class="bi bi-shield-lock" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">需要操作员及以上权限</h4>
      <p class="text-muted" id="perm-text">数据导出仅对操作员、管理员开放，请使用相应账号登录。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=export.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="export-box" class="d-none">

      <!-- 导出条件 -->
      <div class="sensor-card mb-4">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <span class="fw-bold" style="font-size:14px"><i class="bi bi-funnel"></i> 导出条件</span>
          <input type="date" class="form-control form-control-sm" id="f-start" style="width:150px" />
          <span class="text-muted">至</span>
          <input type="date" class="form-control form-control-sm" id="f-end" style="width:150px" />
          <select class="form-select form-select-sm" id="f-limit" style="width:150px">
            <option value="1000">最多 1,000 条</option>
            <option value="5000">最多 5,000 条</option>
            <option value="10000" selected>最多 10,000 条</option>
            <option value="50000">最多 50,000 条</option>
          </select>
          <button class="btn btn-outline-secondary btn-sm" id="btn-clear">清空条件</button>
          <span class="export-tip ms-auto">CSV 格式（UTF-8 带 BOM），可直接用 Excel 打开；留空日期表示全部数据</span>
        </div>
      </div>

      <!-- 数据类型卡片 -->
      <div class="row g-3" id="type-grid">
        <div class="col-12 text-center text-muted py-5">加载中...</div>
      </div>

      <div class="alert alert-light border mt-4" style="font-size:13px">
        <i class="bi bi-info-circle text-success"></i>
        每次导出都会记录到审计日志；操作审计日志仅管理员可导出。
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "export", title: "数据导出", icon: "bi-download" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/export.js?v=1"></script>
  <script src="js/layout.js?v=7"></script>
</body>
</html>
