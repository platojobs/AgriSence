<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计报表 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .r-card { background: #fff; border: 1px solid #e8ecea; border-radius: 10px; padding: 18px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.03); }
    .r-stat-card { border-left: 4px solid var(--agri-green, #2e7d32); }
    .r-stat-card .num { font-size: 26px; font-weight: 700; color: #1b5e20; line-height: 1; }
    .r-stat-card .lbl { font-size: 12.5px; color: #8a8f95; margin-top: 6px; }
    .r-stat-card .bi { font-size: 20px; color: #2e7d32; opacity: .55; }
    .chart-box { height: 320px; }
    .r-filter { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .r-filter .btn { border-radius: 18px; font-size: 13px; }
    .r-filter .btn.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .r-irr-row { display:flex; align-items:center; gap:12px; padding: 6px 0; border-bottom: 1px dashed #e6ece8; font-size: 13px; }
    .r-irr-row:last-child { border-bottom: none; }
    .r-irr-row .tag-start { background:#e6f4ea; color:#2e7d32; padding:2px 8px; border-radius:10px; font-size:11px; }
    .r-irr-row .tag-stop { background:#fff3e0; color:#e67e22; padding:2px 8px; border-radius:10px; font-size:11px; }
    .r-irr-row .reason { color:#555; }
    .r-irr-row .ts { color:#999; font-size:11.5px; margin-left:auto; }
    .perm-box { padding: 60px 20px; text-align: center; color: #555; }
    .perm-box i { font-size: 52px; color: #ccc; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 权限框：未登录/访客 -->
    <div id="perm-box" style="display:none;" class="r-card perm-box">
      <i class="bi bi-shield-lock"></i>
      <h5 class="mt-3 mb-2">访问受限</h5>
      <p class="text-muted small mb-3">数据统计报表需要操作员或管理员权限。</p>
      <a href="login.html?redirect=reports.html" class="btn btn-success btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i> 去登录</a>
      <a href="index.html" class="btn btn-outline-secondary btn-sm ms-2">返回首页</a>
    </div>

    <!-- 报表主体 -->
    <div id="reports-box">

      <!-- 顶部过滤 -->
      <div class="r-card mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h5 class="m-0"><i class="bi bi-bar-chart-steps text-success me-2"></i>数据统计报表</h5>
            <small class="text-muted">环境指标、灌溉活动、告警分布、农事记录、溯源批次一图掌握</small>
          </div>
          <div class="r-filter">
            <span class="text-muted small me-1">统计范围：</span>
            <div class="btn-group btn-group-sm" id="days-group">
              <button class="btn btn-outline-success" data-days="7">近 7 天</button>
              <button class="btn btn-outline-success active" data-days="14">近 14 天</button>
              <button class="btn btn-outline-success" data-days="30">近 30 天</button>
            </div>
            <button class="btn btn-sm btn-success" id="btn-refresh"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
          </div>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-readings">-</div><i class="bi bi-database"></i></div><div class="lbl">采集读数</div></div></div>
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-moisture">-</div><i class="bi bi-droplet-half"></i></div><div class="lbl">平均墒情(%)</div></div></div>
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-temp">-</div><i class="bi bi-thermometer-half"></i></div><div class="lbl">平均温度(°C)</div></div></div>
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-irrigation">-</div><i class="bi bi-droplet"></i></div><div class="lbl">灌溉次数</div></div></div>
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-alerts">-</div><i class="bi bi-bell"></i></div><div class="lbl">告警总数</div></div></div>
        <div class="col-6 col-md-2"><div class="r-card r-stat-card"><div class="d-flex justify-content-between align-items-start"><div class="num" id="stat-batches">-</div><i class="bi bi-box-seam"></i></div><div class="lbl">溯源批次</div></div></div>
      </div>

      <!-- 环境指标日均值 -->
      <div class="r-card mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="m-0"><i class="bi bi-graph-up-arrow text-success me-1"></i>环境指标日均值（墒情 + 温度 + 湿度）</h6>
        </div>
        <div class="chart-box" id="chart-environment"></div>
      </div>

      <!-- 告警等级 + 告警趋势 -->
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-diagram-3 text-success me-1"></i>告警等级分布</h6>
            <div class="chart-box" id="chart-alert-level" style="height:260px;"></div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-activity text-success me-1"></i>告警趋势（按天）</h6>
            <div class="chart-box" id="chart-alert-trend" style="height:260px;"></div>
          </div>
        </div>
      </div>

      <!-- 灌溉 + 农事 -->
      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-droplet text-success me-1"></i>灌溉活动（每天启动次数）</h6>
            <div class="chart-box" id="chart-irrigation" style="height:260px;"></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-tools text-success me-1"></i>农事活动分布</h6>
            <div class="chart-box" id="chart-farm" style="height:260px;"></div>
          </div>
        </div>
      </div>

      <!-- 批次质量 + 作物类型 -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-clipboard-check text-success me-1"></i>溯源批次质量状态</h6>
            <div class="chart-box" id="chart-batch-status" style="height:260px;"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="r-card">
            <h6 class="mb-2"><i class="bi bi-seedling text-success me-1"></i>作物类型分布</h6>
            <div class="chart-box" id="chart-batch-crop" style="height:260px;"></div>
          </div>
        </div>
      </div>

      <!-- 最近灌溉日志 -->
      <div class="r-card">
        <h6 class="mb-2"><i class="bi bi-journal-text text-success me-1"></i>最近灌溉日志</h6>
        <div id="irr-log-list"></div>
      </div>

    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "reports", title: "数据统计报表", icon: "bi-bar-chart-steps" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/reports.js?v=1"></script>
  <script src="js/layout.js?v=8"></script>
</body>
</html>
