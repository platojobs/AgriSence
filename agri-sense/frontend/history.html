<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>历史分析 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
</head>
<body>
  <div id="app-root">

    <!-- 筛选区 -->
    <div class="sensor-card mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-auto">
          <h6 class="mb-0"><i class="bi bi-funnel"></i> 时间范围</h6>
        </div>
        <div class="col-auto">
          <div class="btn-group" role="group" id="range-group">
            <button type="button" class="btn btn-outline-success" data-hours="6">近 6 小时</button>
            <button type="button" class="btn btn-outline-success active" data-hours="24">近 24 小时</button>
            <button type="button" class="btn btn-outline-success" data-hours="168">近 7 天</button>
          </div>
        </div>
        <div class="col-auto ms-auto">
          <h6 class="mb-0 me-2 d-inline"><i class="bi bi-layers"></i> 指标</h6>
          <div class="btn-group" role="group" id="metric-group">
            <button type="button" class="btn btn-outline-secondary metric-btn active" data-metric="soil_moisture" data-color="#8d6e63">土壤墒情</button>
            <button type="button" class="btn btn-outline-secondary metric-btn active" data-metric="temperature" data-color="#ef6c00">温度</button>
            <button type="button" class="btn btn-outline-secondary metric-btn active" data-metric="humidity" data-color="#1976d2">湿度</button>
            <button type="button" class="btn btn-outline-secondary metric-btn" data-metric="light" data-color="#f9a825">光照</button>
          </div>
        </div>
        <div class="col-auto">
          <button class="btn btn-success" id="btn-export"><i class="bi bi-download"></i> 导出 CSV</button>
        </div>
      </div>
    </div>

    <!-- 历史趋势图 -->
    <div class="sensor-card chart-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0"><i class="bi bi-graph-up-arrow"></i> 历史趋势</h6>
        <span class="text-muted small" id="chart-summary">--</span>
      </div>
      <div id="history-chart" style="height:380px;"></div>
    </div>

    <!-- 历史数据表 -->
    <div class="sensor-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0"><i class="bi bi-table"></i> 历史数据表</h6>
        <span class="text-muted small" id="table-info">--</span>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>时间</th>
              <th>土壤墒情(%)</th>
              <th>温度(°C)</th>
              <th>湿度(%)</th>
              <th>光照(lux)</th>
            </tr>
          </thead>
          <tbody id="history-table">
            <tr><td colspan="5" class="text-center text-muted py-3">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="mt-3 d-flex justify-content-between align-items-center">
        <small class="text-muted" id="page-info">第 1 / 1 页</small>
        <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
      </nav>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "history", title: "历史分析", icon: "bi-graph-up-arrow" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/history.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
