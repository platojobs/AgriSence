<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>农业新闻 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .headline { background: linear-gradient(135deg, #1b5e20, #43a047); color: #fff; border-radius: 12px; padding: 22px; cursor: pointer; transition: all .2s; }
    .headline:hover { box-shadow: 0 8px 20px rgba(27,94,32,.3); }
    .headline .tag { font-size: 11px; background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 10px; }
    .headline h5 { margin: 12px 0 8px; font-weight: 700; line-height: 1.5; }
    .headline .sub { font-size: 13px; opacity: .85; }
    .news-item { display: flex; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .news-item:hover { background: #fafcfa; }
    .news-item:last-child { border-bottom: none; }
    .news-item .n-body { flex: 1; min-width: 0; }
    .news-item .n-title { font-weight: 600; font-size: 14px; color: #222; }
    .news-item:hover .n-title { color: #2e7d32; }
    .news-item .n-summary { font-size: 12px; color: #888; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .news-item .n-meta { font-size: 11px; color: #aaa; margin-top: 6px; }
    .n-cat { font-size: 10px; padding: 1px 7px; border-radius: 8px; margin-right: 6px; }
    .c-policy { background: #e3f2fd; color: #1565c0; }
    .c-industry { background: #fff3e0; color: #e65100; }
    .c-tech { background: #f3e5f5; color: #6a1b9a; }
    .c-market { background: #e8f5e9; color: #2e7d32; }
    .top-flag { color: #e53935; font-size: 10px; border: 1px solid #e53935; padding: 0 5px; border-radius: 6px; margin-right: 6px; }
    .article-body { white-space: pre-line; line-height: 1.9; font-size: 14px; color: #333; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 头条 + 分类 -->
    <div class="row g-3 mb-4">
      <div class="col-lg-8" id="headline-wrap">
        <div class="headline h-100">
          <span class="tag">加载中...</span>
          <h5>...</h5>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="sensor-card h-100">
          <h6 class="mb-3"><i class="bi bi-tag"></i> 新闻分类</h6>
          <div class="d-grid gap-2" id="cat-list">
            <button class="btn btn-sm btn-outline-secondary text-start active" data-cat="">
              <i class="bi bi-grid"></i> 全部新闻 <span class="badge bg-secondary float-end" id="c-all">0</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary text-start" data-cat="政策动态">
              <i class="bi bi-megaphone"></i> 政策动态 <span class="badge bg-primary float-end" id="c-policy">0</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary text-start" data-cat="行业动态">
              <i class="bi bi-building"></i> 行业动态 <span class="badge bg-warning text-dark float-end" id="c-industry">0</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary text-start" data-cat="科技前沿">
              <i class="bi bi-rocket-takeoff"></i> 科技前沿 <span class="badge bg-info float-end" id="c-tech">0</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary text-start" data-cat="市场行情">
              <i class="bi bi-graph-up"></i> 市场行情 <span class="badge bg-success float-end" id="c-market">0</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 新闻列表 -->
    <div class="sensor-card">
      <h6 class="mb-2"><i class="bi bi-newspaper"></i> 最新资讯</h6>
      <div id="news-list">
        <div class="text-center text-muted py-4">加载中...</div>
      </div>
    </div>

    <!-- 阅读弹窗 -->
    <div class="modal fade" id="news-modal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h5 class="modal-title" id="m-title"></h5>
              <div class="small text-muted mt-1">
                <span id="m-cat"></span>
                <span class="ms-2" id="m-source"></span>
                <span class="ms-2" id="m-views"></span>
                <span class="ms-2" id="m-date"></span>
              </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="article-body" id="m-content"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "news", title: "农业新闻", icon: "bi-newspaper" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/news.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
