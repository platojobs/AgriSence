<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>审计日志 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .a-table td { vertical-align: middle; font-size: 13px; }
    .a-table th { font-size: 12px; color: #7c857f; font-weight: 600; }
    .act-pill { font-size: 11px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
    .act-auth { background: #e3f2fd; color: #1565c0; }
    .act-user { background: #fdeaea; color: #c0392b; }
    .act-device { background: #e8f5e9; color: #2e7d32; }
    .act-irr { background: #e0f7fa; color: #00838f; }
    .act-alert { background: #fff8e1; color: #f9a825; }
    .act-cms { background: #f3e8fd; color: #7b1fa2; }
    .act-biz { background: #f3f4f6; color: #6b7280; }
    .detail-text { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    .perm-panel { max-width: 480px; margin: 80px auto; text-align: center; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 无权限提示 -->
    <div id="perm-box" class="perm-panel d-none">
      <i class="bi bi-shield-lock" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">需要管理员权限</h4>
      <p class="text-muted" id="perm-text">审计日志仅对管理员开放，请使用管理员账号登录。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=audit.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="audit-box" class="d-none">

      <!-- 统计 -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-journal-text text-success"></i>
            <div><div class="fw-bold" id="cnt-total">0</div><small class="text-muted">审计总条数</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-calendar-day text-primary"></i>
            <div><div class="fw-bold" id="cnt-today">0</div><small class="text-muted">今日操作</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-people text-info"></i>
            <div><div class="fw-bold" id="cnt-users">0</div><small class="text-muted">涉及用户</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-tags text-secondary"></i>
            <div><div class="fw-bold" id="cnt-actions">0</div><small class="text-muted">操作类型</small></div></div>
        </div>
      </div>

      <!-- 过滤条 -->
      <div class="sensor-card mb-3">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <select class="form-select form-select-sm" id="f-action" style="width:170px">
            <option value="">全部操作类型</option>
          </select>
          <input type="text" class="form-control form-control-sm" id="f-username" placeholder="用户名" style="width:140px" />
          <input type="text" class="form-control form-control-sm" id="f-keyword" placeholder="关键词（对象/详情）" style="width:200px" />
          <button class="btn btn-success btn-sm" id="btn-search"><i class="bi bi-search"></i> 查询</button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-reset">重置</button>
          <span class="text-muted ms-auto" style="font-size:12px" id="result-count"></span>
        </div>
      </div>

      <!-- 审计表 -->
      <div class="sensor-card">
        <div class="table-responsive">
          <table class="table table-hover a-table mb-0">
            <thead>
              <tr>
                <th style="width:170px">时间</th>
                <th style="width:110px">操作人</th>
                <th style="width:150px">操作类型</th>
                <th style="width:170px">操作对象</th>
                <th>详情</th>
                <th style="width:120px">IP</th>
              </tr>
            </thead>
            <tbody id="audit-tbody">
              <tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "audit", title: "审计日志", icon: "bi-journal-check" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/audit.js?v=1"></script>
  <script src="js/layout.js?v=7"></script>
</body>
</html>
