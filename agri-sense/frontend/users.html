<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .role-pill { font-size: 11px; padding: 2px 9px; border-radius: 10px; }
    .role-admin { background: #e8f5e9; color: #2e7d32; }
    .role-operator { background: #e3f2fd; color: #1565c0; }
    .role-viewer { background: #f3f4f6; color: #6b7280; }
    .st-active { background: #e8f5e9; color: #2e7d32; font-size: 11px; padding: 2px 9px; border-radius: 10px; }
    .st-disabled { background: #fdeaea; color: #c0392b; font-size: 11px; padding: 2px 9px; border-radius: 10px; }
    .u-table td { vertical-align: middle; font-size: 13px; }
    .u-table th { font-size: 12px; color: #7c857f; font-weight: 600; }
    .perm-panel { max-width: 480px; margin: 80px auto; text-align: center; }
    .role-note { font-size: 12px; color: #8a938d; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 无权限提示 -->
    <div id="perm-box" class="perm-panel d-none">
      <i class="bi bi-shield-lock" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">需要管理员权限</h4>
      <p class="text-muted" id="perm-text">用户管理仅对管理员开放，请使用管理员账号登录。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=users.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="users-box" class="d-none">

      <!-- 统计 -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-people text-success"></i>
            <div><div class="fw-bold" id="cnt-all">0</div><small class="text-muted">全部用户</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-person-gear text-primary"></i>
            <div><div class="fw-bold" id="cnt-admin">0</div><small class="text-muted">管理员</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-person-check text-info"></i>
            <div><div class="fw-bold" id="cnt-operator">0</div><small class="text-muted">操作员</small></div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mini-stat"><i class="bi bi-person text-secondary"></i>
            <div><div class="fw-bold" id="cnt-viewer">0</div><small class="text-muted">访客</small></div></div>
        </div>
      </div>

      <!-- 工具条 -->
      <div class="sensor-card mb-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="role-note">
            角色权限：管理员（全部）&gt; 操作员（业务操作）&gt; 访客（只读浏览）
          </div>
          <button class="btn btn-success btn-sm" id="btn-add-user">
            <i class="bi bi-person-plus"></i> 新增用户
          </button>
        </div>
      </div>

      <!-- 用户表 -->
      <div class="sensor-card">
        <div class="table-responsive">
          <table class="table table-hover u-table mb-0">
            <thead>
              <tr>
                <th style="width:60px">ID</th>
                <th>用户名</th>
                <th>姓名</th>
                <th style="width:150px">角色</th>
                <th style="width:100px">状态</th>
                <th style="width:170px">最近登录</th>
                <th style="width:190px">操作</th>
              </tr>
            </thead>
            <tbody id="user-tbody">
              <tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 新增用户 -->
    <div class="modal fade" id="add-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">新增用户</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-danger py-2 d-none" id="add-alert" style="font-size:13px"></div>
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <input type="text" class="form-control form-control-sm" id="add-username" placeholder="至少 3 个字符" />
            </div>
            <div class="mb-3">
              <label class="form-label">姓名</label>
              <input type="text" class="form-control form-control-sm" id="add-name" placeholder="显示名称" />
            </div>
            <div class="mb-3">
              <label class="form-label">初始密码</label>
              <input type="text" class="form-control form-control-sm" id="add-password" placeholder="至少 6 个字符" />
            </div>
            <div class="mb-2">
              <label class="form-label">角色</label>
              <select class="form-select form-select-sm" id="add-role">
                <option value="viewer">访客（只读）</option>
                <option value="operator">操作员（业务操作）</option>
                <option value="admin">管理员（全部权限）</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
            <button class="btn btn-success btn-sm" id="add-submit">创建</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 重置密码 -->
    <div class="modal fade" id="pwd-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">重置密码</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-danger py-2 d-none" id="pwd-alert" style="font-size:13px"></div>
            <p class="small text-muted mb-2">正在为用户 <b id="pwd-user"></b> 设置新密码</p>
            <input type="text" class="form-control form-control-sm" id="pwd-value" placeholder="新密码，至少 6 位" />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
            <button class="btn btn-success btn-sm" id="pwd-submit">确认重置</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "users", title: "用户管理", icon: "bi-people" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/users.js?v=1"></script>
  <script src="js/layout.js?v=7"></script>
</body>
</html>
