<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>农业知识库 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .k-card { cursor: pointer; transition: all .2s; }
    .k-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
    .k-cat { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; }
    .k-summary { font-size: 13px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .k-meta { font-size: 12px; color: #999; }
    .article-body { white-space: pre-line; line-height: 1.9; font-size: 14px; color: #333; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 统计 -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-book text-success"></i>
          <div><div class="fw-bold" id="cnt-all">0</div><small class="text-muted">全部文章</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-flower2 text-primary"></i>
          <div><div class="fw-bold" id="cnt-plant">0</div><small class="text-muted">种植技术</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-bug text-danger"></i>
          <div><div class="fw-bold" id="cnt-pest">0</div><small class="text-muted">病虫害防治</small></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="mini-stat"><i class="bi bi-cpu text-info"></i>
          <div><div class="fw-bold" id="cnt-smart">0</div><small class="text-muted">智慧农业</small></div></div>
      </div>
    </div>

    <!-- 分类过滤 -->
    <div class="sensor-card mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="btn-group btn-group-sm" id="cat-filter">
          <button class="btn btn-outline-secondary active" data-cat="">全部</button>
          <button class="btn btn-outline-secondary" data-cat="种植技术">种植技术</button>
          <button class="btn btn-outline-secondary" data-cat="病虫害防治">病虫害防治</button>
          <button class="btn btn-outline-secondary" data-cat="水肥管理">水肥管理</button>
          <button class="btn btn-outline-secondary" data-cat="智慧农业">智慧农业</button>
        </div>
        <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索标题关键词..." style="max-width:220px" />
      </div>
    </div>

    <!-- 文章卡片 -->
    <div class="row g-3" id="article-grid">
      <div class="col-12 text-center text-muted py-4">加载中...</div>
    </div>

    <!-- 阅读弹窗 -->
    <div class="modal fade" id="article-modal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h5 class="modal-title" id="m-title"></h5>
              <div class="small text-muted mt-1">
                <span class="k-cat" id="m-cat"></span>
                <span class="ms-2" id="m-author"></span>
                <span class="ms-2" id="m-views"></span>
                <span class="ms-2" id="m-date"></span>
              </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="article-body" id="m-content"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "knowledge", title: "农业知识库", icon: "bi-book" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
