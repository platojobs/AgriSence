<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>病害识别 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
</head>
<body>
  <div id="app-root">

    <div class="row g-3">
      <!-- 上传区 -->
      <div class="col-lg-6">
        <div class="sensor-card h-100">
          <h6 class="mb-3"><i class="bi bi-camera"></i> 上传叶片/果实图片</h6>
          <div class="upload-zone" id="upload-zone">
            <i class="bi bi-cloud-arrow-up" style="font-size:48px;color:#6c757d"></i>
            <div class="mt-2">点击或拖拽图片到此处</div>
            <div class="small text-muted">支持 JPG / PNG，建议清晰拍摄病斑部位</div>
            <input type="file" id="file-input" accept="image/*" class="d-none" />
          </div>
          <div id="preview-wrap" class="mt-3 d-none">
            <img id="preview-img" src="" alt="预览" class="img-fluid rounded border" />
          </div>
          <button class="btn btn-success w-100 mt-3" id="btn-detect" disabled>
            <i class="bi bi-stars"></i> 开始识别
          </button>
          <div class="alert alert-info mt-3 mb-0 small">
            <i class="bi bi-info-circle"></i> 本功能为模拟 AI 识别演示，结果基于内置病害知识库。生产环境可接入训练好的图像分类模型。
          </div>
        </div>
      </div>

      <!-- 结果区 -->
      <div class="col-lg-6">
        <div class="sensor-card h-100">
          <h6 class="mb-3"><i class="bi bi-clipboard-data"></i> 识别结果</h6>
          <div id="result-empty" class="text-center text-muted py-5">
            <i class="bi bi-robot" style="font-size:48px;opacity:.3"></i>
            <div class="mt-2">上传图片后点击「开始识别」</div>
          </div>
          <div id="result-box" class="d-none">
            <div class="d-flex align-items-center mb-3">
              <div class="result-disease me-3" id="r-disease">--</div>
              <div class="ms-auto">
                <div class="small text-muted">置信度</div>
                <div class="fw-bold fs-4 text-success" id="r-conf">--</div>
              </div>
            </div>
            <table class="table table-sm table-borderless mb-3">
              <tr><td class="text-muted" style="width:90px">作物</td><td id="r-crop">--</td></tr>
              <tr><td class="text-muted">症状特征</td><td id="r-symptom">--</td></tr>
              <tr><td class="text-muted">防治建议</td><td id="r-suggestion">--</td></tr>
            </table>
            <div class="alert alert-warning small mb-0">
              <i class="bi bi-exclamation-triangle"></i> 识别结果仅供参考，实际防治请咨询当地农技专家。
            </div>
          </div>
          <div id="loading" class="d-none text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <div class="mt-2 text-muted">AI 正在识别中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 历史识别记录 -->
    <div class="sensor-card mt-4">
      <h6 class="mb-3"><i class="bi bi-clock-history"></i> 识别记录</h6>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>时间</th>
              <th>图片</th>
              <th>识别结果</th>
              <th>作物</th>
              <th>置信度</th>
            </tr>
          </thead>
          <tbody id="history-table">
            <tr><td colspan="5" class="text-center text-muted py-3">暂无识别记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>window.PAGE_CONFIG = { key: "disease", title: "病害识别", icon: "bi-bug" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/disease.js"></script>
  <script src="js/layout.js"></script>
  <style>
    .upload-zone { border: 2px dashed #ced4da; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .2s; }
    .upload-zone:hover { border-color: #198754; background: #f8fff9; }
    .result-disease { font-size: 22px; font-weight: 700; color: #dc3545; }
  </style>
</body>
</html>
