<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>固件管理 - AgriSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/layout.css" rel="stylesheet" />
  <style>
    .fw-table td { vertical-align: middle; font-size: 14px; }
    .fw-ver { font-family: monospace; font-weight: 700; }
    .fw-latest { background: #e8f5e9; color: #2e7d32; }
    .fw-checksum { font-family: monospace; font-size: 11px; color: #9aa5a0; }
    .ota-box { background: #f4f8f5; border: 1px dashed #c8d8cc; border-radius: 10px;
      padding: 12px 16px; font-size: 13px; }
    .ota-box code { color: #2e7d32; }
  </style>
</head>
<body>
  <div id="app-root">

    <!-- 未登录提示 -->
    <div id="perm-box" class="perm-panel d-none" style="max-width:480px;margin:80px auto;text-align:center">
      <i class="bi bi-cpu" style="font-size:52px;color:#c5cec8"></i>
      <h4 class="mt-3">请先登录</h4>
      <p class="text-muted">固件管理需要登录后使用。</p>
      <a class="btn btn-success px-4" href="login.html?redirect=firmware.html">
        <i class="bi bi-box-arrow-in-right"></i> 去登录
      </a>
    </div>

    <div id="fw-box" class="d-none">
      <!-- 工具条 -->
      <div class="sensor-card mb-3">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <div class="input-group input-group-sm" style="max-width:200px">
            <span class="input-group-text"><i class="bi bi-cpu"></i></span>
            <input type="text" class="form-control" id="f-filter-model" placeholder="按型号过滤，如 esp32" />
          </div>
          <button class="btn btn-outline-secondary btn-sm" id="btn-filter"><i class="bi bi-funnel"></i> 过滤</button>
          <button class="btn btn-success btn-sm ms-auto" id="btn-upload">
            <i class="bi bi-cloud-arrow-up"></i> 上传固件
          </button>
        </div>
      </div>

      <!-- 固件列表 -->
      <div class="sensor-card mb-3">
        <div class="table-responsive">
          <table class="table table-hover fw-table mb-0">
            <thead>
              <tr>
                <th>版本</th><th>设备型号</th><th>文件名</th><th>大小</th>
                <th>MD5 校验</th><th>更新说明</th><th>下载次数</th><th>上传时间</th>
                <th style="width:200px">操作</th>
              </tr>
            </thead>
            <tbody id="fw-list">
              <tr><td colspan="9" class="text-center text-muted py-5">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- OTA 接口说明 -->
      <div class="ota-box">
        <i class="bi bi-info-circle"></i> <strong>设备端 OTA 检查接口</strong>：
        <code>GET /api/firmware/latest?model={型号}&current={当前版本}</code>
        返回最新固件版本、MD5 校验与下载地址，设备定时轮询即可实现远程升级。
      </div>
    </div>
  </div>

  <!-- 上传固件弹窗 -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">上传固件</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">版本号 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="f-version" placeholder="如 1.2.0" />
            </div>
            <div class="col-md-6">
              <label class="form-label">设备型号 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="f-model" placeholder="如 esp32" value="esp32" />
            </div>
            <div class="col-12">
              <label class="form-label">固件文件 <span class="text-danger">*</span></label>
              <input type="file" class="form-control" id="f-file" accept=".bin,.hex,.img,.zip,.txt" />
              <div class="form-text">支持 .bin / .hex / .img / .zip，最大 20MB</div>
            </div>
            <div class="col-12">
              <label class="form-label">更新说明</label>
              <textarea class="form-control" id="f-changelog" rows="3" placeholder="本版本的变更内容"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-success" id="btn-do-upload">
            <i class="bi bi-cloud-arrow-up"></i> 上传
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>window.PAGE_CONFIG = { key: "firmware", title: "固件管理", icon: "bi-cpu" };</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dashboard.js?v=4"></script>
  <script src="js/firmware.js?v=1"></script>
  <script src="js/layout.js?v=9"></script>
</body>
</html>
